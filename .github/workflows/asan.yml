name: AddressSanitizer

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:
    branches:
      - '*'

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg_binary_cache

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test_with_sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel] # Windows ASan remains disabled.
        preset: [vcpkg-asan-debug, vcpkg-ubsan-debug]
    runs-on: ${{ matrix.os }}
    name: asan.${{ startsWith(matrix.os, 'ubuntu') && 'ubuntu-latest' || startsWith(matrix.os, 'macos') && 'macos-latest' || matrix.os }}.${{ matrix.preset }}
    env:
      UBSAN_OPTIONS: "print_stacktrace=1"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.preset }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DRL_BUILD_EXTERNAL_PARSER=On
      - name: Build
        run: cmake --build build --target rltest binary_parser_unit_tests
      - name: Run unit tests
        run: |
          cd build
          ctest --verbose --output-on-failure --no-tests=error
