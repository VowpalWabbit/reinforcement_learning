name: Windows Nuget

on:
  push:
    tags:
      - '*'
    branches:
      - master
      - 'releases/**'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg_binary_cache

jobs:
  build_nuget_windows:
    name: nuget.${{ matrix.toolset }}-${{ matrix.build_type }}
    runs-on: ${{matrix.os}}
    env:
      RL_VCPKG_PLATFORM_TOOLSET: ${{ matrix.toolset }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022"]
        build_type: ["Debug", "Release"]
        toolset: ["v141", "v142", "v143"]
  
    steps:
      # Get repository and setup dependencies
      - name: Enable long paths before recursive checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install legacy toolsets
        if: matrix.toolset != 'v143'
        shell: pwsh
        run: |
          $component = if ("${{ matrix.toolset }}" -eq "v141") { "Microsoft.VisualStudio.Component.VC.v141.x86.x64" } else { "Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64" }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $process = Start-Process $installer -ArgumentList "modify", "--installPath", "`"$env:VSINSTALLDIR`"", "--add", $component, "--quiet", "--norestart" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "Toolset installation failed: $($process.ExitCode)" }
      # NASM required to compile OpenSSL assembly language code
      - uses: ilammy/setup-nasm@v1
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.toolset }}-${{ matrix.build_type }}
      - uses: NuGet/setup-nuget@v2
      - name: Dependencies
        run: >
          ./ext_libs/vcpkg/vcpkg.exe install
          --host-triplet=x64-windows
          --triplet=x64-windows
          --overlay-triplets="${{ github.workspace }}/.github/triplets"
          --x-install-root="${{ github.workspace }}/build/vcpkg_installed"

      # Get version number
      - name: Update git tags
        # Needed because actions/checkout performs a shallow checkout without tags
        run: git fetch --unshallow --tags --recurse-submodules=no
      - name: Get version number
        id: get_version
        shell: bash
        run: |
          version=$(./.scripts/version_number.py)
          echo "Generated version number: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
      
      # Compile code and create package
      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -T ${{ matrix.toolset }}
          -DVCPKG_MANIFEST_MODE=Off
          -DRL_BUILD_NUGET=On
          -DRL_NUGET_PACKAGE_NAME=RLClientLibNativeStatic
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRL_NUGET_PACKAGE_VERSION="${{ steps.get_version.outputs.version }}"
          -DNATIVE_NUGET_PLATFORM_TAG=x64
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/build/vcpkg_installed"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/.github/triplets"
          -Drlclientlib_BUILD_DOTNET=Off
      - name: Compile
        run: cmake --build ./build --config ${{ matrix.build_type }} -v
      - name: Create Nuget package
        run: cmake --install ./build --config ${{ matrix.build_type }} --prefix ./nuget_staging -v

      # Upload the package
      - name: Get file name
        id: nuget_name
        shell: bash
        run: |
          cd nuget_staging
          ls
          NugetFileName=(*.nupkg)
          echo "Found nuget package: ${NugetFileName[0]}"
          echo "NugetFileName=${NugetFileName[0]}" >> $GITHUB_OUTPUT
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RLClientLibNativeStatic-${{ matrix.toolset }}-${{ matrix.build_type }}-x64.${{ steps.get_version.outputs.version }}.nupkg
          path: nuget_staging/${{ steps.nuget_name.outputs.NugetFileName }}
          if-no-files-found: error

  test_nuget_windows:
    needs: [build_nuget_windows]
    name: nuget-test.${{ matrix.toolset }}-${{ matrix.build_type }}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022"]
        build_type: ["Debug", "Release"]
        toolset: ["v141", "v142", "v143"]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install legacy toolsets
        if: matrix.toolset != 'v143'
        shell: pwsh
        run: |
          $component = if ("${{ matrix.toolset }}" -eq "v141") { "Microsoft.VisualStudio.Component.VC.v141.x86.x64" } else { "Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64" }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $process = Start-Process $installer -ArgumentList "modify", "--installPath", "`"$env:VSINSTALLDIR`"", "--add", $component, "--quiet", "--norestart" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "Toolset installation failed: $($process.ExitCode)" }
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      # Get version number
      - name: Update git tags
        # Needed because actions/checkout performs a shallow checkout without tags
        run: git fetch --unshallow --tags --recurse-submodules=no
      - name: Get version number
        id: get_version
        shell: bash
        run: |
          version=$(./.scripts/version_number.py)
          echo "Generated version number: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
      
      # Download and install nuget
      - uses: actions/download-artifact@v4
        with:
          name: RLClientLibNativeStatic-${{ matrix.toolset }}-${{ matrix.build_type }}-x64.${{ steps.get_version.outputs.version }}.nupkg
          path: downloaded_nugets
      - name: List downloaded files
        run: ls downloaded_nugets
      - name: Install nuget
        run: >
          nuget install
          -Source "${{ github.workspace }}\downloaded_nugets"
          -OutputDirectory "${{ github.workspace }}\nuget\test\packages"
          -Version "${{ steps.get_version.outputs.version }}"
          -Verbosity detailed
          -NonInteractive
          RLClientLibNativeStatic-${{ matrix.toolset }}-${{ matrix.build_type }}-x64
      - name: Rename package install directory to omit version number
        run: |
          cd nuget\test\packages
          mv * RLClientLibNativeStatic-${{ matrix.toolset }}-${{ matrix.build_type }}-x64
      
      # Compile and run
      - name: Build test
        run: |
          cd nuget\test
          msbuild test_rl_nuget.vcxproj -t:rebuild "-property:Configuration=${{ matrix.build_type }};Platform=x64;PlatformToolset=${{ matrix.toolset }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\${{ matrix.build_type }}\test_rl_nuget.exe
