name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '26 11 * * 5'

permissions:
  actions: read
  contents: read
  security-events: write

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg_binary_cache

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  analyze-cpp:
    name: Analyze C++
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          --preset vcpkg-debug
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DBUILD_TESTING=OFF
      - name: Build
        run: |
          cmake --build build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-python:
    name: Analyze Python bindings
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild Python
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-csharp:
    name: Analyze CSharp bindings
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/ext_libs/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg_binary_cache

    steps:
      - name: Enable long paths before recursive checkout
        run: git config --global core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet t4
        run: dotnet tool install --global dotnet-t4
      - uses: ./.github/actions/setup-build
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          --preset vcpkg-debug
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -Drlclientlib_BUILD_DOTNET=ON
      - name: Build
        run: |
          cmake --build build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
