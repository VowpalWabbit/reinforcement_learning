name: Linux / Python

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
    runs-on: ubuntu-22.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg_binary_cache
    strategy:
      fail-fast: false
      matrix:
        config:
        - { version: '3.11', base_path: /opt/python/cp311-cp311/ }
        - { version: '3.12', base_path: /opt/python/cp312-cp312/ }
        - { version: '3.13', base_path: /opt/python/cp313-cp313/ }
        - { version: '3.14', base_path: /opt/python/cp314-cp314/ }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-key: python-${{ matrix.config.version }}
      - name: Build wheel
        shell: bash
        env:
          PYTHON: ${{ matrix.config.base_path }}bin/python
        run: bash ./.scripts/linux/build-python-wheel.sh
      - name: Upload built wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel_${{ matrix.config.version }}
          path: audit_output/
          if-no-files-found: error
  test:
    needs: build
    container:
      image: python:${{ matrix.config.version }}-slim-bookworm
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config:
        - { version: '3.11' }
        - { version: '3.12' }
        - { version: '3.13' }
        - { version: '3.14' }
    steps:
      - uses: actions/checkout@v4
      - name: Download Wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel_${{ matrix.config.version }}
          path: ${{ github.workspace }}/wheel_${{ matrix.config.version }}
      - name: Test wheel
        shell: bash
        run: |
          export wheel_files=(wheel_${{ matrix.config.version }}/*)
          export wheel_file="${wheel_files[0]}"
          echo Installing ${wheel_file}...
          pip install ${wheel_file}
          python ./bindings/python/test/unit_test.py
