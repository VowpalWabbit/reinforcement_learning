name: Integration with latest VW

on:
  schedule:
    - cron: "0 8 * * *"

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg_binary_cache

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  LatestVW_RLClientLib:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update VW to latest
        shell: bash
        run: |
          pushd ext_libs/vowpal_wabbit
          git config --global --add safe.directory "$(pwd)"
          git fetch origin master
          git reset --hard origin/master
          git submodule update --init --recursive
          popd
      - uses: ./.github/actions/setup-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          --preset vcpkg-debug
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: |
          cmake --build build
      - name: Test
        run: |
          cd build
          ctest --verbose --output-on-failure --no-tests=error

  LatestVW_BinaryParser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update VW to latest
        shell: bash
        run: |
          pushd ext_libs/vowpal_wabbit
          git config --global --add safe.directory "$(pwd)"
          git fetch origin master
          git reset --hard origin/master
          git submodule update --init --recursive
          popd
      - uses: ./.github/actions/setup-build
      - name: Configure
        run: >
          cmake -S external_parser -B external_parser/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_DIR="${{ github.workspace }}"
          -DWARNING_AS_ERROR=OFF
          -Wno-deprecated
          -DFMT_SYS_DEP=ON
          -DSPDLOG_SYS_DEP=ON
          -DRAPIDJSON_SYS_DEP=ON
          -DVW_ZLIB_SYS_DEP=ON
          -DVW_BOOST_MATH_SYS_DEP=ON
          -DVW_GTEST_SYS_DEP=ON
      - name: Build
        run: |
          cd external_parser
          cmake --build build
      - name: Test
        run: |
          cd external_parser/build
          ctest --verbose --output-on-failure --no-tests=error
