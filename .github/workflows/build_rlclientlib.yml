name: Build RLClientLib

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:
    branches:
      - '*'

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg_binary_cache

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  build-ubuntu:
    # Ubuntu build has ONNX extension and Valgrind test
    name: rlclientlib-${{ matrix.build_type }}-ubuntu-latest
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.build_type }}
      - name: Install ONNX
        run: |
          ONNX_FILENAME="onnxruntime-linux-x64-1.13.1"
          curl --fail --location --output onnxruntime.nupkg \
            "https://pkgs.dev.azure.com/dnceng/9ee6d478-d288-47f7-aacc-f6e6d082ae6d/_packaging/45bacae2-5efb-47c8-91e5-8ec20c22b4f8/nuget/v3/flat2/microsoft.ml.onnxruntime/1.13.1/microsoft.ml.onnxruntime.1.13.1.nupkg"
          echo "590e655b036e6e663ad1274bf8650ae671859005cd61eff432dfd3dba66b5904  onnxruntime.nupkg" | sha256sum --check
          unzip -q onnxruntime.nupkg -d onnxruntime-package
          mkdir -p "$ONNX_FILENAME/lib"
          cp -r onnxruntime-package/build/native/include "$ONNX_FILENAME/include"
          cp onnxruntime-package/runtimes/linux-x64/native/libonnxruntime.so "$ONNX_FILENAME/lib/"
          ln -s libonnxruntime.so "$ONNX_FILENAME/lib/libonnxruntime.so.1.13.1"
          echo "1.13.1" > "$ONNX_FILENAME/VERSION_NUMBER"
          echo "ONNXRUNTIME_ROOT=$ONNX_FILENAME" >> $GITHUB_ENV
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          --preset vcpkg-${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -Drlclientlib_BUILD_ONNXRUNTIME_EXTENSION=ON
          -DONNXRUNTIME_ROOT="${{ github.workspace }}/${{ env.ONNXRUNTIME_ROOT }}"
      - name: Build
        run: |
          cmake --build build
      - name: Test
        run: |
          cd build
          ctest --verbose --output-on-failure --no-tests=error
      - name: Test with Valgrind
        run: |
          cd build
          sudo apt-get update -y
          sudo apt install -y valgrind
          valgrind --quiet --error-exitcode=100 --undef-value-errors=no --leak-check=full ./unit_test/rltest -- valgrind

  build-macos:
    # Mac build doesn't have any additional features enabled
    name: rlclientlib-${{ matrix.build_type }}-macos-latest
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.build_type }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          --preset vcpkg-${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: |
          cmake --build build
      - name: Test
        run: |
          cd build
          ctest --verbose --output-on-failure --no-tests=error

  build-windows:
    # Windows build has C# bindings
    name: rlclientlib-${{ matrix.build_type }}-windows-latest
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    steps:
      - name: Enable long paths before recursive checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet t4
        run: dotnet tool install --global dotnet-t4
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.build_type }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          --preset vcpkg-${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -Drlclientlib_BUILD_DOTNET=ON
      - name: Build
        run: |
          cmake --build build
      - name: Test
        run: |
          cd build
          ctest --verbose --output-on-failure --no-tests=error
